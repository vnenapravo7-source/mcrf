[package]
name = "csqtt-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
csqtt-core = { path = "../../../work/turn-engines/focsq/luminescq-focsq-bfa176f/backend" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync"] }
tokio-util = "0.7.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[patch.crates-io]
primp = { path = "../../../work/turn-engines/focsq/luminescq-focsq-bfa176f/backend/vendor/primp" }

[profile.release]
opt-level = 3
strip = true

