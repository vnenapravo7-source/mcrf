name: Telegram download monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: telegram-download-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STATE_BRANCH: telegram-monitor-state
      STATE_PATH: .github/telegram-monitor-state.json
      STATE_LOCAL: /tmp/mcrf-telegram-monitor-state.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read persistent monitor state
        id: state
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            let fresh = false;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${process.env.STATE_BRANCH}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              fresh = true;
            }
            core.setOutput('fresh', String(fresh));
            if (fresh) {
              core.setOutput('sha', '');
              return;
            }
            try {
              const response = await github.rest.repos.getContent({ owner, repo, path: process.env.STATE_PATH, ref: process.env.STATE_BRANCH });
              if (response.data.type !== 'file' || response.data.encoding !== 'base64') throw new Error('Invalid monitor state file');
              fs.writeFileSync(process.env.STATE_LOCAL, Buffer.from(response.data.content, 'base64'));
              core.setOutput('sha', response.data.sha);
            } catch (error) {
              // A missing state file on an established branch must never silently rebaseline.
              throw error;
            }

      - name: Calculate changes and notify Telegram
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOURCE_STATS_URL: ${{ vars.SOURCE_STATS_URL }}
          SOURCE_STATS_TOKEN: ${{ secrets.SOURCE_STATS_TOKEN }}
        run: python maintenance/telegram_download_monitor.py --state "$STATE_LOCAL"

      - name: Persist accepted observations on the state branch
        uses: actions/github-script@v8
        env:
          PREVIOUS_SHA: ${{ steps.state.outputs.sha }}
          FRESH_BRANCH: ${{ steps.state.outputs.fresh }}
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync(process.env.STATE_LOCAL).toString('base64');
            if (process.env.FRESH_BRANCH === 'true') {
              // Publish the first state atomically with the new branch. A failed first
              // poll must not leave an empty branch that prevents the next baseline.
              const blob = await github.rest.git.createBlob({ ...context.repo, content, encoding: 'base64' });
              const tree = await github.rest.git.createTree({ ...context.repo, tree: [{ path: process.env.STATE_PATH, mode: '100644', type: 'blob', sha: blob.data.sha }] });
              const commit = await github.rest.git.createCommit({ ...context.repo, message: 'chore: establish Telegram monitor baseline', tree: tree.data.sha, parents: [] });
              await github.rest.git.createRef({ ...context.repo, ref: `refs/heads/${process.env.STATE_BRANCH}`, sha: commit.data.sha });
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              branch: process.env.STATE_BRANCH,
              path: process.env.STATE_PATH,
              message: 'chore: persist Telegram monitor observations',
              content,
              ...(process.env.PREVIOUS_SHA ? { sha: process.env.PREVIOUS_SHA } : {}),
            });
