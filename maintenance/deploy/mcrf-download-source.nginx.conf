# Add these zones inside nginx's http {} block (not server {}). IP-based rate
# limiting is in memory only; disable access logs for the complete location.
limit_req_zone $binary_remote_addr zone=mcrf_download_rate:1m rate=2r/s;
limit_conn_zone $server_name zone=mcrf_download_concurrency:1m;

# Add this location inside the EXISTING TLS server for vnenapravo7.ru.
# Do not expose the service until HTTPS and the certificate have been verified.
location ^~ /mcrf-downloads/ {
    access_log off;
    # Error logs can contain client addresses, so suppress them here too.
    error_log /dev/null crit;
    client_max_body_size 2k;
    client_body_timeout 5s;
    limit_req zone=mcrf_download_rate burst=10 nodelay;
    limit_req_status 429;
    limit_conn mcrf_download_concurrency 24;
    proxy_connect_timeout 2s;
    proxy_read_timeout 7s;
    proxy_send_timeout 7s;
    proxy_buffering off;
    proxy_cache off;
    # Trailing slash strips /mcrf-downloads/ before passing to the service.
    proxy_pass http://127.0.0.1:8787/;
    proxy_set_header Host localhost;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
}
